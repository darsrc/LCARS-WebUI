[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lcars-ui"
version = "7.0.0"
description = "Build code-rendered LCARS applications in Python with typed manifests and explicit actions"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "LCARS UI Team" }]
keywords = ["lcars", "server-driven-ui", "fastapi", "dashboard", "user-interface"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Web Environment",
  "Framework :: FastAPI",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Application Frameworks",
  "Topic :: Software Development :: User Interfaces",
  "Typing :: Typed",
]
dependencies = [
  "fastapi>=0.141.1,<0.142",
  "starlette>=1.3.1,<1.7",
  "anyio>=4.4,<4.12",
  "uvicorn[standard]>=0.29.0,<1.0",
  "pydantic>=2.0,<3.0",
  "python-multipart>=0.0.9,<1.0",
]

[project.urls]
Homepage = "https://github.com/darsrc/LCARS-WebUI"
Documentation = "https://github.com/darsrc/LCARS-WebUI/wiki"
Repository = "https://github.com/darsrc/LCARS-WebUI.git"
Issues = "https://github.com/darsrc/LCARS-WebUI/issues"
Changelog = "https://github.com/darsrc/LCARS-WebUI/releases"

[project.scripts]
lcars = "lcars_ui.cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
  "pytest-cov>=5.0.0",
  "httpx2>=2.0.0,<3.0",
  "ruff>=0.6.0",
  "mypy>=1.10.0",
  "jsonschema>=4.22.0",
  "pip-audit>=2.7.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lcars_ui = ["py.typed", "_static/index.html", "_static/assets/*"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = "pandas.*"
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
