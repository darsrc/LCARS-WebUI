name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lcars-ui

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: lcars-ui/pyproject.toml

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: lcars-ui/frontend/package-lock.json

      - name: Create virtual environment
        run: python -m venv .venv

      - name: Install Python dependencies
        run: .venv/bin/python -m pip install -e ".[dev]"

      - name: Run the complete gate
        run: make ci

  e2e:
    name: Playwright E2E (${{ matrix.mode }})
    runs-on: ubuntu-latest
    # Deliberately its own job, not folded into `make ci`/the `ci` job above.
    # Use the runner image's Chrome instead of `playwright install`: browser
    # extraction can hang indefinitely, while the config already supports an
    # explicit executable path.
    strategy:
      fail-fast: false
      matrix:
        # dev: what caught the real bug this job exists for (an ajv-generated
        #      bare CJS require() that only explodes under vite's dev module
        #      graph); also what contributors run locally day to day.
        # preview: build + vite preview — the actual artifact users get.
        # Both are cheap once the browser is cached, so run both rather than
        # picking one.
        mode: [dev, preview]
    defaults:
      run:
        working-directory: lcars-ui/frontend

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: lcars-ui/frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Resolve hosted Chrome
        id: hosted-chrome
        run: |
          chrome_path="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$chrome_path"
          echo "path=$chrome_path" >> "$GITHUB_OUTPUT"

      - name: Run Playwright E2E suite
        run: npx playwright test --project=chromium --reporter=line,html
        env:
          LCARS_PLAYWRIGHT_SKIP_BACKENDS: ${{ matrix.mode == 'preview' && '1' || '' }}
          LCARS_PLAYWRIGHT_CHROMIUM_PATH: ${{ steps.hosted-chrome.outputs.path }}

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.mode }}
          path: lcars-ui/frontend/playwright-report/
          retention-days: 7
