name: Publish wiki

on:
  push:
    branches: [main]
    paths:
      - "wiki/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-wiki
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Mirror authored wiki to GitHub Wiki
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          gh auth setup-git
          wiki_checkout="${RUNNER_TEMP}/published-wiki"
          git clone --branch master "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.wiki.git" "${wiki_checkout}"
          rsync -a --delete --exclude='.git/' "${GITHUB_WORKSPACE}/wiki/" "${wiki_checkout}/"
          git -C "${wiki_checkout}" config user.name "github-actions[bot]"
          git -C "${wiki_checkout}" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "${wiki_checkout}" add --all
          if git -C "${wiki_checkout}" diff --cached --quiet; then
            echo "Published wiki is already current."
            exit 0
          fi
          git -C "${wiki_checkout}" commit -m "Sync wiki from ${SOURCE_SHA}"
          git -C "${wiki_checkout}" push origin master
